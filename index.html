<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>suva.</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(18, 19, 26, 0.85);
            --accent-color: #5865f2;
            --text-main: #ffffff;
            --text-sub: #b9bbbe;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated Background Stars */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1c29 0%, #08080c 100%);
        }

        /* Profile Card Container */
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius);
            backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Banner Header */
        .banner {
            width: 100%;
            height: 140px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Avatar Section */
        .avatar-container {
            position: relative;
            margin-top: -50px;
            margin-left: 20px;
            display: inline-block;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #12131a;
            object-fit: cover;
        }

        .status-dot {
            width: 16px;
            height: 16px;
            background-color: #23a55a;
            border-radius: 50%;
            border: 3px solid #12131a;
            position: absolute;
            bottom: 8px;
            right: 4px;
        }

        /* Profile Details */
        .profile-content {
            padding: 15px 20px 20px 20px;
        }

        .username-title {
            font-size: 26px;
            font-weight: 800;
            color: #5865f2;
            letter-spacing: -0.5px;
        }

        .handle-row {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 2px;
            margin-bottom: 12px;
        }

        .badges {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Audio Player */
        .player-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .player-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #1db954;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .song-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .album-art {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .song-info {
            flex-grow: 1;
        }

        .song-title {
            font-size: 15px;
            font-weight: 700;
        }

        .song-artist {
            font-size: 13px;
            color: var(--text-sub);
        }

        .play-btn {
            background: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        /* Bio Box */
        .bio-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.4;
            color: #e1e1e1;
            margin-bottom: 16px;
        }

        .bio-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* Footer / Admin Trigger */
        .footer {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            padding-top: 5px;
            transition: color 0.2s;
        }

        .footer:hover {
            color: var(--text-sub);
        }

        /* Admin Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal {
            background: #12131a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 18px;
            text-align: center;
        }

        .modal input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: #0b0c10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .modal input:focus {
            border-color: var(--accent-color);
        }

        .modal-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .admin-dashboard {
            display: none;
            text-align: left;
        }

        .admin-dashboard h4 {
            color: #23a55a;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="bg-particles"></div>

    <div class="card">
        <!-- Banner Image -->
        <div class="banner" style="background-image: url('image_19.png');"></div>

        <!-- Avatar & Status -->
        <div class="avatar-container">
            <img src="image_20.png" alt="Profile" class="avatar">
            <div class="status-dot"></div>
        </div>

        <!-- Main Content -->
        <div class="profile-content">
            <div class="username-title">suva.</div>
            <div class="handle-row">soxsuva</div>

            <div class="badges">
                <span class="badge">⚡ ZFC</span>
                <span class="badge">✈️ Suva</span>
                <span class="badge">👑 VIP</span>
            </div>

            <!-- Music Player -->
            <div class="player-card">
                <div class="player-header">
                    <span>Listening to Audio</span>
                </div>
                <div class="song-details">
                    <img src="image_21.png" alt="Album Cover" class="album-art">
                    <div class="song-info">
                        <div class="song-title">misery.</div>
                        <div class="song-artist">pupsies</div>
                    </div>
                    <button class="play-btn" onclick="toggleAudio()">
                        <span id="play-icon">▶</span>
                    </button>
                </div>
                <audio id="audio-player" loop src="audio.mp3"></audio>
            </div>

            <!-- Bio Box -->
            <div class="bio-box">
                <div class="bio-title">Bio</div>
                <div>welcome to suva.</div>
            </div>

            <div class="footer" onclick="openAdminModal()">
                Created by suva.
            </div>
        </div>
    </div>

    <!-- Secure Admin Modal Panel -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <div id="login-form">
                <h3>Admin Access</h3>
                <input type="email" id="adminEmail" placeholder="Email">
                <input type="password" id="adminPassword" placeholder="Password">
                <button class="modal-btn" onclick="verifyAdmin()">Login</button>
            </div>

            <div id="admin-dashboard" class="admin-dashboard">
                <h4>System Status: Secure</h4>
                <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 15px;">Admin logged in as soxsuva@gmail.com</p>
                <button class="modal-btn" style="background: #da373c;" onclick="closeAdminModal()">Close Panel</button>
            </div>
        </div>
    </div>

    <script>
        function toggleAudio() {
            const player = document.getElementById('audio-player');
            const icon = document.getElementById('play-icon');
            if (player.paused) {
                player.play();
                icon.textContent = '❚❚';
            } else {
                player.pause();
                icon.textContent = '▶';
            }
        }

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('admin-dashboard').style.display = 'none';
            document.getElementById('adminEmail').value = '';
            document.getElementById('adminPassword').value = '';
        }

        // SHA-256 Hashing for Client-Side Security Verification
        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyAdmin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            // Pre-calculated SHA-256 hashes for credentials
            const targetEmailHash = "be3cf9b3f37bcf7b23395d8efd234c264b3ef1bd588fb7c81d86d5e1ef93bfbc"; // soxsuva@gmail.com
            const targetPassHash = "9d36440e0be2cb003b1e35bb3d1b802e8d350ecbc9219c6767eb27eb2bf0cdd3"; // Bullhorn79!

            const inputEmailHash = await hashString(email);
            const inputPassHash = await hashString(password);

            if (inputEmailHash === targetEmailHash && inputPassHash === targetPassHash) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
            } else {
                alert('Invalid Credentials');
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('adminModal');
            if (event.target === modal) {
                closeAdminModal();
            }
        }
    </script>
</body>
</html>
